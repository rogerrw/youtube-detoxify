<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Detoxify</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>YouTube Detoxify</h1>
      </header>

      <main>
        <div class="allowlist-section">
          <h3 class="allowlist-title">Title Keywords Allowlist</h3>
          <p class="allowlist-description">
            Videos with these keywords in the title will be allowed. All other
            videos will be blocked.
          </p>
          <div class="allowlist-input-container">
            <input
              type="text"
              id="keywordInput"
              placeholder="Enter keyword..."
              class="keyword-input"
            />
            <button id="addKeywordBtn" class="btn btn-small">Add</button>
          </div>
          <div id="keywordsList" class="keywords-list"></div>
        </div>

        <div class="allowlist-section">
          <h3 class="allowlist-title">Channel Allowlist</h3>
          <p class="allowlist-description">
            Videos from these channels will be allowed. All other videos will be
            blocked.
          </p>
          <div class="allowlist-input-container">
            <input
              type="text"
              id="channelInput"
              placeholder="Enter channel name..."
              class="keyword-input"
            />
            <button id="addChannelBtn" class="btn btn-small">Add</button>
          </div>
          <div id="channelsList" class="keywords-list"></div>
        </div>
      </main>
    </div>
    <script src="popup.js"></script>
  </body>
</html>

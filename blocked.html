<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Detoxify - Blocked</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-align: center;
        padding: 20px;
      }

      .container {
        max-width: 600px;
      }

      h1 {
        font-size: 48px;
        margin-bottom: 30px;
      }

      h2 {
        font-size: 32px;
        margin-bottom: 20px;
        font-weight: 600;
      }

      p {
        font-size: 18px;
        line-height: 1.6;
        opacity: 0.9;
        margin-bottom: 15px;
      }

      .subtitle {
        font-size: 14px;
        opacity: 0.8;
        max-width: 500px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚫</h1>
      <h2>You're venturing into unintentional Youtube.</h2>
      <p>
        This video doesn't match your allowlist settings and has been blocked.
      </p>
      <p class="subtitle">
        To watch this video, add the channel or a keyword from the title to your
        allowlist in the extension popup.
      </p>
    </div>
  </body>
</html>
